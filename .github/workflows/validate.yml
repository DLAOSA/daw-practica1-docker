name: Validar entorno Docker

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Arrancar los tres servicios
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 240
          docker compose exec -T web nginx -t
          docker compose exec -T php php -l /var/www/html/index.php
          mkdir -p artifacts
          docker compose ps > artifacts/servicios.txt
          docker compose images >> artifacts/servicios.txt
      - name: Preparar el navegador para la captura
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Comprobar respuesta, consulta y vista móvil
        run: node tests/browser.cjs
      - name: Comprobar el error de conexión
        run: |
          docker compose stop db
          node tests/browser.cjs --offline
      - name: Comprobar la recuperación
        run: |
          docker compose up -d --wait --wait-timeout 120
          node tests/browser.cjs
      - name: Guardar registros
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/contenedores.log
      - name: Publicar evidencias de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-docker
          path: artifacts/
      - name: Detener el entorno de pruebas
        if: always()
        run: docker compose down -v
